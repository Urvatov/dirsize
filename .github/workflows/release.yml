name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run lint
        run: bun run lint

      - name: Check build
        run: bun run build

  build-binaries:
    needs: validate
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: dirsize-linux-x64
            build_cmd: bun build --compile --minify ./source/main.ts --outfile dirsize-linux-x64
          - os: windows-latest
            artifact_name: dirsize-windows-x64.exe
            build_cmd: bun build --compile --minify ./source/main.ts --outfile dirsize-windows-x64.exe
          - os: macos-latest
            artifact_name: dirsize-darwin-arm64
            build_cmd: bun build --compile --minify ./source/main.ts --outfile dirsize-darwin-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build standalone executable
        run: ${{ matrix.build_cmd }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}

  publish-release:
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build package and tarball
        run: |
          bun run build
          bun pm pack

      - name: Download all binary artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Move tarball to release directory
        run: |
          mv *.tgz release-artifacts/
          ls -la release-artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
          generate_release_notes: true
